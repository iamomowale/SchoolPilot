version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: schoolpilot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schoolpilot_dev}
      POSTGRES_USER: ${POSTGRES_USER:-schoolpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schoolpilot_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: schoolpilot-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: schoolpilot-minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-schoolpilot}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-schoolpilot-secret}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
